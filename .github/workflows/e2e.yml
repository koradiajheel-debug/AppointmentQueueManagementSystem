name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-e2e:
    name: Cross-Portal Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend portals
        run: |
          npm run build --workspace=@queuesmart/customer-portal
          npm run build --workspace=@queuesmart/admin-portal

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Portal Verification
        run: |
          echo "Running mock-mode and live-portal automated browser smoke tests..."
          # Start previews and verify response
          npx vite preview --port 3000 --outDir apps/customer-portal/dist &
          npx vite preview --port 3001 --outDir apps/admin-portal/dist &
          sleep 4
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:3001 || exit 1
