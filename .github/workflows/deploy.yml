name: Production Deployment

on:
  push:
    branches: [main]

jobs:
  deploy-backend-and-portals:
    name: Deploy to Cloud (Render / Railway)
    runs-on: ubuntu-latest
    if: github.repository == 'queuesmart/queuesmart'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trigger Render Deploy Webhook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render production deployment webhook..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deploy status output
        run: echo "Deployment workflow triggered successfully."
