services:
  # QueueSmart Backend REST & Socket.IO API
  - type: web
    name: queuesmart-backend
    env: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=@queuesmart/server
    startCommand: cd server && npm run prisma:deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CUSTOMER_URL
        value: https://queuesmart-citizen.onrender.com
      - key: ADMIN_URL
        value: https://queuesmart-admin.onrender.com

  # QueueSmart Citizen Portal (PWA)
  - type: web
    name: queuesmart-citizen
    env: static
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=@queuesmart/customer-portal
    staticPublishPath: ./apps/customer-portal/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://queuesmart-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://queuesmart-backend.onrender.com
      - key: VITE_USE_MOCKS
        value: "false"

  # QueueSmart Staff & Admin Portal
  - type: web
    name: queuesmart-admin
    env: static
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=@queuesmart/admin-portal
    staticPublishPath: ./apps/admin-portal/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://queuesmart-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://queuesmart-backend.onrender.com
      - key: VITE_USE_MOCKS
        value: "false"
